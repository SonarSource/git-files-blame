name: Native blame comparison IT
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - master
      - 'branch-*'
  workflow_dispatch:

concurrency:
  group: native-blame-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  quick-it:
    name: Quick blame IT (synthetic repo, offline)
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: 2026.8.14
      - uses: SonarSource/ci-github-actions/config-gradle@v1
      - run: ./gradlew integrationTest --stacktrace
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quick-it-results
          path: '**/build/test-results/integrationTest/**/*.xml'
          if-no-files-found: ignore

  full-qa-it:
    name: Full QA blame IT (OpenJDK + Linux kernel)
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 90
    if: |
      github.ref == 'refs/heads/master' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-qa'))
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.2.0
        with:
          version: 2026.8.14
      - uses: SonarSource/ci-github-actions/config-gradle@v1
      - run: ./gradlew integrationTestFullQa --stacktrace
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-qa-it-results
          path: '**/build/test-results/integrationTestFullQa/**/*.xml'
          if-no-files-found: ignore
