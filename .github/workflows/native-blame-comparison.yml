name: Native blame comparison IT
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - master
      - 'branch-*'
  workflow_dispatch:

concurrency:
  group: native-blame-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  quick-it:
    name: Quick blame IT (synthetic repo, offline)
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
      - uses: SonarSource/ci-github-actions/config-gradle@v2
      - run: ./gradlew integrationTest --stacktrace
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quick-it-results
          path: '**/build/test-results/integrationTest/**/*.xml'
          if-no-files-found: ignore

  full-qa-it:
    name: Full QA blame IT (OpenJDK + Linux kernel)
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 90
    if: |
      github.ref == 'refs/heads/master' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-qa'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
      - uses: SonarSource/ci-github-actions/config-gradle@v2
      - run: ./gradlew integrationTestFullQa --stacktrace
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-qa-it-results
          path: '**/build/test-results/integrationTestFullQa/**/*.xml'
          if-no-files-found: ignore
