name: Native blame comparison IT
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - master
      - 'branch-*'
  workflow_dispatch:

concurrency:
  group: native-blame-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  quick-it:
    name: Quick blame IT (synthetic repo, offline)
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.10.13
      - uses: SonarSource/ci-github-actions/config-gradle@v1
      - run: ./gradlew integrationTest --stacktrace
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quick-it-results
          path: '**/build/test-results/integrationTest/**/*.xml'
          if-no-files-found: ignore

  full-qa-it:
    name: Full QA blame IT (OpenJDK + Linux kernel)
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 90
    if: |
      github.ref == 'refs/heads/master' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-qa'))
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.10.13
      - uses: SonarSource/ci-github-actions/config-gradle@v1
      - run: ./gradlew integrationTestFullQa --stacktrace
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-qa-it-results
          path: '**/build/test-results/integrationTestFullQa/**/*.xml'
          if-no-files-found: ignore
