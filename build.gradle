plugins {
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'java'
    id 'java-test-fixtures'
    id 'jvm-test-suite'
    id 'com.jfrog.artifactory' version '6.0.4'
    id "org.sonarqube" version "7.2.2.6593"
    id 'jacoco'
    id 'signing'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withJavadocJar()
    withSourcesJar()
}

license {
    header = rootProject.file('HEADER')
    strictCheck = true
    encoding = 'UTF-8'
    mapping {
        java = 'SLASHSTAR_STYLE'
        js = 'SLASHSTAR_STYLE'
        ts = 'SLASHSTAR_STYLE'
        tsx = 'SLASHSTAR_STYLE'
        css = 'SLASHSTAR_STYLE'
    }
    includes(['**/*.java', '**/*.js', '**/*.ts', '**/*.tsx', '**/*.css'])
    excludes(['**/diff/*.java'])
}

javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.7.0.202606012155-r'
    implementation 'org.slf4j:slf4j-api:1.7.36'

    testCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.apache.commons:commons-lang3:3.20.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-core:5.23.0'

    // The library declares JGit as 'implementation', so it is not exposed transitively to fixtures.
    // SyntheticRepoGenerator builds repos directly through JGit's object-database APIs.
    testFixturesImplementation 'org.eclipse.jgit:org.eclipse.jgit:7.7.0.202606012155-r'
}

test {
    useJUnitPlatform {
        excludeTags 'benchmark'
    }
}

testing {
    suites {
        integrationTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
                implementation testFixtures(project())
                implementation 'org.eclipse.jgit:org.eclipse.jgit:7.7.0.202606012155-r'
                implementation 'org.assertj:assertj-core:3.27.7'
            }
            targets.all {
                testTask.configure {
                    useJUnitPlatform {
                        excludeTags 'fullQa'
                    }
                    outputs.upToDateWhen { false }
                    testLogging {
                        showStandardStreams = true
                        events 'passed', 'skipped', 'failed', 'standardOut'
                    }
                }
            }
        }
    }
}

tasks.register('integrationTestFullQa', Test) {
    group = 'verification'
    description = 'Native-git vs library blame comparison against OpenJDK and the Linux kernel (heavy clones; label/master-gated).'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform {
        includeTags 'fullQa'
    }
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed', 'standardOut'
    }
    // The default test JVM heap is sized for the lightweight synthetic-repo suite and is too small for blaming
    // real clones of the Linux kernel/OpenJDK. Give it a heap generous enough for that, and fork a fresh JVM per
    // test method so an OOM in one scenario can't poison JGit's static WindowCache for the rest of the suite -
    // that poisoning is what turned one real OOM into three unrelated-looking MissingObjectException failures.
    maxHeapSize = '4g'
    forkEvery = 1
}

tasks.register('benchmark', Test) {
    group = 'verification'
    description = 'Runs performance benchmarks against synthetic large repositories (excluded from the default test task).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed', 'standardOut'
    }
}

apply plugin: 'java'
apply plugin: 'com.jfrog.artifactory'
apply plugin: 'maven-publish'
apply plugin: 'signing'

ext {
    release = project.hasProperty('release') && project.getProperty('release')
    buildNumber = System.getProperty("buildNumber")
}
// Replaces the version defined in sources, usually x.y-SNAPSHOT, by a version identifying the build.
if (version.endsWith('-SNAPSHOT') && ext.buildNumber != null) {
    def versionSuffix = (version.toString().count('.') == 1 ? ".0.${ext.buildNumber}" : ".${ext.buildNumber}")
    version = version.replace('-SNAPSHOT', versionSuffix)
}

repositories {
    def repository = project.hasProperty('qa') ? 'sonarsource-qa' : 'sonarsource'
    maven {
        url = "https://repox.jfrog.io/repox/${repository}"
        // The environment variables ARTIFACTORY_PRIVATE_USERNAME and ARTIFACTORY_PRIVATE_PASSWORD are used on QA env (Jenkins)
        // On local box, please add artifactoryUsername and artifactoryPassword to ~/.gradle/gradle.properties
        def artifactoryUsername = System.env.'ARTIFACTORY_PRIVATE_USERNAME' ?: (project.hasProperty('artifactoryUsername') ? project.getProperty('artifactoryUsername') : '')
        def artifactoryPassword = System.env.'ARTIFACTORY_PRIVATE_PASSWORD' ?: (project.hasProperty('artifactoryPassword') ? project.getProperty('artifactoryPassword') : '')
        if (artifactoryUsername && artifactoryPassword) {
            credentials {
                username = artifactoryUsername
                password = artifactoryPassword
            }
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = projectTitle
                description = project.description
                url = 'http://www.sonarqube.org/'
                organization {
                    name = 'SonarSource'
                    url = 'http://www.sonarsource.com'
                }
                licenses {
                    license {
                        name = 'GNU LGPL 3'
                        url = 'http://www.gnu.org/licenses/lgpl.txt'
                        distribution = 'repo'
                    }
                }
                scm {
                    url = 'https://github.com/SonarSource/git-files-blame'
                }
                developers {
                    developer {
                        id = 'sonarsource-team'
                        name = 'SonarSource Team'
                    }
                }
            }
            from components.java
            if (release) {
                artifact sourcesJar
                artifact javadocJar
            }
        }
    }
}

artifactory {
    clientConfig.setIncludeEnvVars(true)
    clientConfig.setEnvVarsExcludePatterns('*password*,*PASSWORD*,*secret*,*MAVEN_CMD_LINE_ARGS*,sun.java.command,*token*,*TOKEN*,*LOGIN*,*login*,*key*,*KEY*,*signing*')
    contextUrl = System.getenv('ARTIFACTORY_URL')
    publish {
        repository {
            repoKey = System.getenv('ARTIFACTORY_DEPLOY_REPO')
            username = System.getenv('ARTIFACTORY_DEPLOY_USERNAME') ?: providers.gradleProperty("artifactoryUsername").orNull
            password = System.getenv('ARTIFACTORY_DEPLOY_PASSWORD') ?: providers.gradleProperty("artifactoryPassword").orNull
        }
        defaults {
            properties = [
                    'build.name'      : 'git-files-blame',
                    'build.number'    : System.getenv('BUILD_NUMBER'),
                    'pr.branch.target': System.getenv('GITHUB_BASE_BRANCH'),
                    'pr.number'       : System.getenv('PULL_REQUEST'),
                    'vcs.branch'      : System.getenv('GITHUB_BRANCH'),
                    'vcs.revision'    : System.getenv('GIT_SHA1'),
                    'version'         : version
            ]
            publications('mavenJava')
            publishPom = true
            publishIvy = false
        }
    }
    clientConfig.info.setBuildName('git-files-blame')
    clientConfig.info.setBuildNumber(System.getenv('BUILD_NUMBER'))
    // The name of this variable is important because it's used by the delivery process when extracting version from Artifactory build info.
    clientConfig.info.addEnvironmentProperty('PROJECT_VERSION', "${version}")
}

sonar {
    properties {
        property 'sonar.projectName', projectTitle
        property "sonar.exclusions","cli/**,src/main/java/org/sonar/scm/git/blame/diff/**"
        property "sonar.java.coveragePlugin", "jacoco"
    }
}

jacoco {
    toolVersion = "0.8.7"
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = false
        html.required = false
    }
}

tasks['sonar'].dependsOn jacocoTestReport

signing {
    def signingKeyId = findProperty("signingKeyId")
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    def branch = System.getenv()["GITHUB_REF_NAME"]
    required = (branch == 'master' || branch ==~ 'branch-[\\d.]+') && gradle.taskGraph.hasTask(":artifactoryPublish")
    sign publishing.publications
}

tasks.withType(Sign) {
    onlyIf {
        def branch = System.getenv()["GITHUB_REF_NAME"]
        return !artifactoryPublish.skip &&
                (branch == 'master' || branch ==~ 'branch-[\\d.]+') &&
                gradle.taskGraph.hasTask(":artifactoryPublish")
    }
}
